# Redis Cluster overlay for integration testing.
#
# Usage (podman-compose or docker compose):
#   podman-compose -f docker-compose.yaml -f docker-compose.redis-cluster.yaml \
#       up -d redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
#   # Wait ~5s for healthy, then form cluster (podman or docker):
#   podman exec redis-node-0 redis-cli --cluster create \
#       127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
#       127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005 \
#       --cluster-replicas 1 --cluster-yes
#   # docker exec redis-node-0 redis-cli --cluster create \
#   #     127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
#   #     127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005 \
#   #     --cluster-replicas 1 --cluster-yes
#   # Run integration tests:
#   TEST=true PYTHONPATH=. REDIS_CLUSTER_URL=127.0.0.1 \
#       pytest -m redis_cluster util/test/ -v
#
# The cluster uses 6 nodes (3 masters + 3 replicas) on ports 7000-7005.
# Each node announces 127.0.0.1 so the host-side Python client receives
# routable MOVED/ASK redirects.

services:
  redis-node-0:
    image: docker.io/library/redis:7.4
    container_name: redis-node-0
    network_mode: host
    command: >
      redis-server
      --port 7000
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --bind 127.0.0.1
      --protected-mode no
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7000", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-1:
