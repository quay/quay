# Quay Jira-aware triage harness with the Quay communication skill.
base: https://raw.githubusercontent.com/fullsend-ai/agents/d5c4d0d2f2c23cf3aa89e4a5bd4e40c90f003196/harness/triage.yaml#sha256=5ada8f85cee204e2fcb8ba6935b301345b3dc56ee3f306d6eafd35f7bc4312a7
model: claude-sonnet-4-6

trigger: >
  event.entity.kind == "work_item"
    && (
      event.transition.kind == "opened"
      ||
      (event.transition.kind == "comment_added"
        && has(event.transition.comment.command)
        && event.transition.comment.command == "/fs-triage")
    )

overlays:
  - when: 'runtime.forge == "jira"'
    env:
      runner:
        JIRA_DUPLICATE_TRANSITION: Closed
        JIRA_NOT_PLANNED_TRANSITION: Closed
        JIRA_SPLIT_TRANSITION: Closed

skills:
  - https://github.com/quay/ai-helpers/tree/eddcd18a9a667c2e90bd6eda822ef6b999259cbe/plugins/dev/skills/caveman#sha256=6430b571b0df04d92be7f95515632ee9865d39dfe8fb4dd0ccf647be3b991322

allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/agents/
  - https://github.com/quay/ai-helpers/
allow_runtime_fetch: true
