name: CI Generator

on:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ci-generator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: ci-generator/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra test

      - name: pytest
        run: uv run pytest

      - name: generate --check round-trip
        run: |
          out=$(mktemp -d)
          uv run python generate.py --output "$out"
          uv run python generate.py --check --output "$out"
