name: BigQuery CI Sync

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 6:00 UTC
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days to look back for CI runs'
        required: false
        default: '7'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sync:
    if: github.repository == 'quay/quay'
    name: Sync CI data to BigQuery
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-cloud-bigquery requests

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7b53cdc2a387814ed14eec026287aac689ae8c9b # v2.1.9
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Run BigQuery sync
        env:
          GITHUB_TOKEN: ${{ secrets.GH_CI_SYNC_PAT }}
          PROJECT_ID: quay-devel
          DATASET_ID: quay_ci
          DAYS_BACK: ${{ inputs.days_back || '7' }}
        run: python .github/scripts/sync_quay_ci_bq.py
