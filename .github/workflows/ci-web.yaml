name: CI / Web

on:
  workflow_call:
    inputs:
      is-pr:
        description: Whether this is a pull request (true) or a push (false)
        required: true
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  frontend-plugin:
    name: Build Frontend Plugin
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'

    - name: Install pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: 10
        run_install: false

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Cache pnpm store
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: cd web && pnpm install --frozen-lockfile

    - name: Build plugin
      run: cd web && pnpm run build-plugin

  unit-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Verify npm lockfile is valid
        run: cd web && npm ci --ignore-scripts --legacy-peer-deps --dry-run

      - name: Run unit tests with coverage
        run: cd web && pnpm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: web
          files: ./web/coverage/lcov.info
          disable_search: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: web/coverage/
          retention-days: 7

  e2e-test-check:
    if: ${{ inputs.is-pr }}
    runs-on: ubuntu-latest
    name: e2e test coverage check
    permissions:
      pull-requests: read
    steps:
      - name: Check for E2E tests on significant changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          # Get list of changed files in the PR
          CHANGED_FILES=$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only)

          # Skip check for dependency-only updates
          NON_DEP_FILES=$(echo "$CHANGED_FILES" | grep -cvE \
            '(^|/)(requirements.*\.txt|setup\.py|setup\.cfg|pyproject\.toml|Pipfile(\.lock)?|package\.json|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|go\.mod|go\.sum|\.pre-commit-config\.yaml)$' \
            || true)

          if [ "$NON_DEP_FILES" -eq 0 ]; then
            echo "Dependency-only update detected. Skipping e2e test check."
            exit 0
          fi

          # Directories and patterns that count as "source code" changes
          # Excludes: tests, docs, config, CI, static assets, agent docs
          SOURCE_CHANGES=$(echo "$CHANGED_FILES" | grep -cE \
            '^(auth|buildman|buildstatus|buildtrigger|data|digest|endpoints|events|features|health|image|notifications|oauth|plans|proxy|storage|util|workers|web/src)/' \
            || true)

          # Subtract files that are themselves tests within source directories
          TEST_FILES_IN_SOURCE=$(echo "$CHANGED_FILES" | grep -cE \
            '^(auth|buildman|buildstatus|buildtrigger|data|digest|endpoints|events|features|health|image|notifications|oauth|plans|proxy|storage|util|workers)/test/' \
            || true)

          SOURCE_CHANGES=$((SOURCE_CHANGES - TEST_FILES_IN_SOURCE))

          # Check if any Playwright e2e test files were added or modified
          E2E_CHANGES=$(echo "$CHANGED_FILES" | grep -cE \
            '^web/playwright/e2e/.*\.spec\.ts$' \
            || true)

          echo "Source code changes: $SOURCE_CHANGES"
          echo "Playwright e2e test changes: $E2E_CHANGES"

          if [ "$E2E_CHANGES" -gt 0 ]; then
            echo "Playwright e2e tests were added or updated."
            exit 0
          fi

          if [ "$SOURCE_CHANGES" -gt 0 ]; then
            echo "::error::This PR changes $SOURCE_CHANGES source files but includes no Playwright e2e tests. PRs with source file changes require e2e test coverage in web/playwright/e2e/."
            exit 1
          fi

          echo "No significant source changes detected."

  playwright:
    if: ${{ inputs.is-pr }}
    name: Playwright E2E Tests
    runs-on: quay-003-medium-ubuntu-24-x64
    timeout-minutes: 90
    env:
      QUAY_HOTRELOAD: "false"
      AWS_ACCESS_KEY_ID: GKe2e0123456789abcdef01234
      AWS_SECRET_ACCESS_KEY: e2e0123456789abcdef0123456789abcdef0123456789abcdef01234567890ab
      S3_ENDPOINT: http://localhost:3900
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Quay
        uses: ./.github/actions/setup-quay
        with:
          with-clair: true
          with-keycloak: true
          with-repomirror: true
          with-georep: true
          with-builds: true
          use-gha-cache: false
          extra-config: |
            FEATURE_MAILING: true
            FEATURE_SECURITY_SCANNER: true
            FEATURE_SECURITY_NOTIFICATIONS: true
            DEFAULT_UI: react
            AUTOPRUNE_TASK_RUN_MINIMUM_INTERVAL_MINUTES: 0
            SSRF_ALLOWED_HOSTS:
              - host.containers.internal

      # Browser runs on the runner host; compose only adds host.containers.internal
      # inside containers. Map both names so OIDC redirects and build tooling resolve.
      - name: Map container host aliases for browser/OIDC
        run: |
          echo "127.0.0.1 host.containers.internal" | sudo tee -a /etc/hosts
          echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Start LDAP server (pre-initialize for later auth swap)
        run: |
          docker compose up -d ldap
          echo "Waiting for LDAP to be ready..."
          timeout=90
          while [ $timeout -gt 0 ]; do
            if docker exec quay-ldap ldapsearch -x -H ldap://localhost:3389 \
                -b "dc=example,dc=org" -s base &>/dev/null; then
              echo "LDAP is ready!"
              break
            fi
            sleep 2
            timeout=$((timeout - 2))
          done
          if [ $timeout -le 0 ]; then
            echo "::error::LDAP failed to initialize within 90 seconds"
            docker logs quay-ldap
            exit 1
          fi

      - name: Set up Node.js with npm caching
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Keep npm (not pnpm) for redhat-3.16 — package-lock.json is the lockfile here.
      - name: Install dependencies
        run: cd web && npm ci

      - name: Get Playwright version
        id: playwright-version
        run: |
          cd web
          PLAYWRIGHT_VERSION=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd web && npx playwright install --with-deps

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd web && npx playwright install-deps

      - name: Install skopeo for multi-arch image tests
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Install crane for unique image tests
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.20.6

      - name: Install regctl for CLI interop tests
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0

      - name: Run Database auth tests (React + Legacy UI)
        id: db-tests
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-results/db
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: cd web && npx playwright test --grep-invert "@auth:OIDC|@auth:LDAP" --reporter=blob

      - name: Swap to OIDC authentication
        id: swap-oidc
        if: always()
        run: |
          pip install pyyaml -q
          # Merge Keycloak OIDC login config
          python3 .github/actions/setup-quay/merge-yaml.py \
            local-dev/stack/config.yaml \
            local-dev/keycloak/keycloak-config.yaml \
            > local-dev/stack/config.yaml.tmp
          mv local-dev/stack/config.yaml.tmp local-dev/stack/config.yaml
          # Merge OIDC auth type + feature flags (inline, no duplicate file)
          cat > /tmp/oidc-auth-overlay.yaml <<'EOF'
          AUTHENTICATION_TYPE: OIDC
          FEATURE_TEAM_SYNCING: true
          FEATURE_NONSUPERUSER_TEAM_SYNCING_SETUP: true
          SUPER_USERS:
            - admin
            - admin_oidc
          EOF
          python3 .github/actions/setup-quay/merge-yaml.py \
            local-dev/stack/config.yaml \
            /tmp/oidc-auth-overlay.yaml \
            > local-dev/stack/config.yaml.tmp
          mv local-dev/stack/config.yaml.tmp local-dev/stack/config.yaml
          # Restart Quay and wait for healthy (120s; matches setup-quay default)
          docker restart quay-quay
          curl -sf --retry 60 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/health/instance > /dev/null
          echo "Quay is ready with OIDC auth"

      - name: Run OIDC auth tests
        id: oidc-tests
        if: always() && steps.swap-oidc.outcome == 'success'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-results/oidc
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: cd web && npx playwright test --grep @auth:OIDC --reporter=blob

      - name: Swap to LDAP authentication
        id: swap-ldap
        if: always()
        run: |
          pip install pyyaml -q
          # Merge LDAP config (sets AUTHENTICATION_TYPE: LDAP + connection details)
          python3 .github/actions/setup-quay/merge-yaml.py \
            local-dev/stack/config.yaml \
            local-dev/ldap/ldap-config.yaml \
            > local-dev/stack/config.yaml.tmp
          mv local-dev/stack/config.yaml.tmp local-dev/stack/config.yaml
          # Merge LDAP-specific feature flags
          cat > /tmp/ldap-auth-overlay.yaml <<'EOF'
          FEATURE_TEAM_SYNCING: true
          FEATURE_NONSUPERUSER_TEAM_SYNCING_SETUP: true
          STAGGER_WORKERS: false
          SUPER_USERS:
            - admin
            - admin_ldap
          EOF
          python3 .github/actions/setup-quay/merge-yaml.py \
            local-dev/stack/config.yaml \
            /tmp/ldap-auth-overlay.yaml \
            > local-dev/stack/config.yaml.tmp
          mv local-dev/stack/config.yaml.tmp local-dev/stack/config.yaml
          # Restart Quay and wait for healthy (120s; matches setup-quay default)
          docker restart quay-quay
          curl -sf --retry 60 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/health/instance > /dev/null
          echo "Quay is ready with LDAP auth"

      - name: Run LDAP auth tests
        id: ldap-tests
        if: always() && steps.swap-ldap.outcome == 'success'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-results/ldap
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: cd web && npx playwright test --grep @auth:LDAP --reporter=blob

      - name: Merge test reports
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: |
          cd web
          mkdir -p all-blob-reports
          find blob-results -name '*.zip' -exec cp {} all-blob-reports/ \; 2>/dev/null
          if [ "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            npx playwright merge-reports --reporter=html,json all-blob-reports
          else
            echo "::warning::No blob reports found. Test reports were not generated."
          fi

      - name: Save PR number
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p ./pr-info
          echo "$PR_NUMBER" > ./pr-info/pr_number.txt

      - name: Upload PR info
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-info
          path: pr-info/
          retention-days: 1

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: web/test-results/
          retention-days: 30

      - name: Collect Quay logs on failure
        if: failure()
        uses: ./.github/actions/collect-quay-logs
        with:
          artifact-name: 'quay-container-logs'
