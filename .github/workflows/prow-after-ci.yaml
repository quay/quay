name: Prow After CI
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions: {}

jobs:
  dispatch:
    name: Comment /pipeline remaining
    runs-on: ubuntu-latest
    # The path pins sentinel.yaml: the legacy CI.yaml on release branches is also named CI.
    if: github.event.workflow_run.path == '.github/workflows/sentinel.yaml' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: prow-after-ci-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      # The workflow_run event's pull_requests array is empty for fork heads, so look the PR up by head.
      - name: Comment /pipeline remaining on the PR at this head
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f base=master -f head="$OWNER:$BRANCH" --paginate |
            jq -r --arg sha "$SHA" --arg repo "$REPO" '.[] | select(.head.sha == $sha and .head.repo.full_name == $repo) | .number' |
            while read -r pr; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -f body='/pipeline remaining'
            done
