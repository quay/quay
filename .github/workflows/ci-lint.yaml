name: CI
on:
  workflow_call:
    inputs:
      is-pr:
        required: true
        type: boolean

jobs:
  pr-title-check:
    name: conventional commit check
    if: ${{ inputs.is-pr }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check PR title
        run: .github/scripts/check-pr-title.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-22.04
    if: ${{ inputs.is-pr }}
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0  # fetch all commits and branches for pre-commit

    - name: Set up Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.12

    - name: Set up Node 22
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10
        run_install: false

    - name: Install web dependencies
      run: cd ./web && pnpm install --frozen-lockfile

    - name: Run pre-commit checks
      uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      with:
        extra_args: --from-ref origin/${{ github.base_ref }} --to-ref HEAD --verbose

  jira-ticket-check:
    name: Require Jira ticket
    runs-on: ubuntu-latest
    if: ${{ inputs.is-pr }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed files
        id: changed-files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Get list of changed files compared to base branch
          CHANGED_FILES=$(git diff origin/"$BASE_REF"...HEAD --name-only)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check for protected files
        id: protected-files
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.changed_files }}
        run: |
          PROTECTED=()

          # Check for API changes (endpoints/api/*.py, excluding tests)
          while IFS= read -r file; do
            if [[ $file =~ ^endpoints/api/.*\.py$ ]] && [[ ! $file =~ ^endpoints/api/test/ ]]; then
              PROTECTED+=("$file")
            fi
          done <<< "$CHANGED_FILES"

          # Check for database migrations
          while IFS= read -r file; do
            if [[ $file =~ ^data/migrations/versions/.*\.py$ ]]; then
              PROTECTED+=("$file")
            fi
          done <<< "$CHANGED_FILES"

          # Check for config schema changes
          while IFS= read -r file; do
            if [[ "$file" == "util/config/schema.py" ]] || [[ "$file" == "config.py" ]]; then
              PROTECTED+=("$file")
            fi
          done <<< "$CHANGED_FILES"

          # Output results
          if [ ${#PROTECTED[@]} -eq 0 ]; then
            echo "has_protected_files=false" >> $GITHUB_OUTPUT
          else
            echo "has_protected_files=true" >> $GITHUB_OUTPUT
            echo "protected_files<<EOF" >> $GITHUB_OUTPUT
            printf '%s\n' "${PROTECTED[@]}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Verify JIRA tracker in PR title
        if: steps.protected-files.outputs.has_protected_files == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROTECTED_FILES: ${{ steps.protected-files.outputs.protected_files }}
        run: |
          # A re-run replays the original event, so fetch the current title.
          PR_TITLE="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title)"

          # Print detected protected files for visibility
          echo "Protected files detected (require JIRA tracker for release docs):"
          echo "$PROTECTED_FILES" | while read -r file; do
            [ -n "$file" ] && echo "  - $file"
          done
          echo ""
          echo "Protected file categories:"
          echo "  • API endpoints: endpoints/api/*.py"
          echo "  • DB migrations: data/migrations/versions/*.py"
          echo "  • Config schema: util/config/schema.py, config.py"
          echo ""

          # Check if PR title matches JIRA pattern: [optional-redhat-version] (PROJQUAY|QUAYIO)-####: description
          title_regex='^(\[(redhat|mirror-registry)-[0-9]+\.[0-9]+\]\ )?(PROJQUAY-[0-9]+|QUAYIO-[0-9]+):\ [a-z]+(\([^)]+\))?:\ .+$'
          if [[ "$PR_TITLE" =~ $title_regex ]]; then
            echo "✓ Valid JIRA ticket found in PR title: \"$PR_TITLE\""
            exit 0
          else
            echo "✗ JIRA tracker check failed"
            echo ""
            echo "PR title: \"$PR_TITLE\""
            echo ""
            echo "Required format: PROJQUAY-#### or QUAYIO-#### followed by colon and description"
            echo "(Changes to API, DB, or configuration must have JIRA tracker for release advisory)"
            echo ""
            echo "Valid examples:"
            echo "  - PROJQUAY-1234: fix(nginx): correct keepalive config"
            echo "  - QUAYIO-5678: feat(api): add user management endpoint"
            echo "  - [redhat-3.13] PROJQUAY-9999: feat(db): add audit log migration"
            echo ""
            exit 1
          fi
