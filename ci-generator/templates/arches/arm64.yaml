releases:
  arm64-latest:
    candidate:
      architecture: arm64
      product: ocp
      stream: nightly
      version: "{{ ocp_version }}"
tests:
- steps:
    dependencies:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: release:arm64-latest
    env:
      OCP_ARCH: arm64
      COMPUTE_ARCH: arm64
      CONTROL_ARCH: arm64
