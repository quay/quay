tests:
- steps:
    env:
      ENABLE_BUILD_SUPPORT: "true"
      PLAYWRIGHT_GREP_INVERT: '@auth:OIDC|@auth:LDAP|@feature:QUOTA_NOTIFICATIONS|@webhook|saves and loads architecture filter with mirror configuration|loads existing architecture filter from saved mirror configuration'
      QUAY_EXTRA_CONFIG: |
        FEATURE_PROGRAMMATIC_BOOTSTRAP: false
        FEATURE_USER_METADATA: true
        FEATURE_IMMUTABLE_TAGS: true
        FEATURE_SPARSE_INDEX: true
        FEATURE_QUOTA_NOTIFICATIONS: true
        FEATURE_EDIT_QUOTA: true
        FEATURE_CHANGE_TAG_EXPIRATION: true
        FEATURE_IMAGE_PULL_STATS: false
        LOG_ARCHIVE_LOCATION: default
        ACTION_LOG_ARCHIVE_LOCATION: default
        SESSION_TIMEOUT: 2h
        FEATURE_MAILING: true
        MAIL_SERVER: mailpit.quay-enterprise.svc.cluster.local
        MAIL_PORT: 1025
        MAIL_USE_TLS: false
        MAIL_USE_AUTH: false
        MAIL_DEFAULT_SENDER: quay@quayqe.local
        DEFAULT_UI: react
        SUPER_USERS:
          - admin
        GLOBAL_READONLY_SUPER_USERS:
          - readonly
    test:
    - ref: quay-enable-catalogsource
    - ref: quay-provisioning-tls
    - ref: quay-provisioning-builder
    - ref: quay-deploy-mailpit
    - ref: "{{ deploy_ref }}"
    - ref: quay-test-e2e
