base_images:
  cli:
    name: "4.22"
    namespace: ocp
    tag: cli
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.22
images:
  items:
  - capabilities:
    - arm64
    dockerfile_path: Dockerfile
    to: quay-server
  - dockerfile_path: web/Containerfile.playwright
    to: quay-playwright-runner
  skip_if_only_changed: ^(\.agents/|\.claude/|ci-generator/|docs/|.*\.md$)
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  arm64-latest:
    candidate:
      architecture: arm64
      product: ocp
      stream: nightly
      version: "4.22"
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: aws-s3-arm64
  optional: true
  steps:
    cluster_profile: aws-quay-qe
    dependencies:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: release:arm64-latest
      QUAY_CI_IMAGE: pipeline:quay-server
    env:
      BASE_DOMAIN: quayqe.devcluster.openshift.com
      COMPUTE_ARCH: arm64
      COMPUTE_NODE_TYPE: m6g.4xlarge
      CONTROL_ARCH: arm64
      ENABLE_BUILD_SUPPORT: "true"
      OCP_ARCH: arm64
      PLAYWRIGHT_GREP_INVERT: '@auth:OIDC|@auth:LDAP|@feature:QUOTA_NOTIFICATIONS|@webhook|saves and loads architecture filter
        with mirror configuration|loads existing architecture filter from saved mirror configuration|image build context carries
        the baked classifier artifact path|Nginx 502 error page when backend is unreachable'
      PLAYWRIGHT_USE_IMAGE_TESTS: "true"
      QUAY_BUILDER_IMAGE: registry.redhat.io/quay/quay-builder-rhel9@sha256:9ced74943d3147fb6eac6df05c50a47553d550586be736068c47767c6f68c777
      QUAY_EXTRA_CONFIG: |
        FEATURE_PROGRAMMATIC_BOOTSTRAP: false
        FEATURE_USER_METADATA: true
        FEATURE_IMMUTABLE_TAGS: true
        FEATURE_SPARSE_INDEX: true
        FEATURE_QUOTA_NOTIFICATIONS: true
        FEATURE_EDIT_QUOTA: true
        FEATURE_CHANGE_TAG_EXPIRATION: true
        FEATURE_IMAGE_PULL_STATS: false
        LOG_ARCHIVE_LOCATION: default
        ACTION_LOG_ARCHIVE_LOCATION: default
        SESSION_TIMEOUT: 2h
        DEFAULT_UI: react
        SUPER_USERS:
          - admin
        GLOBAL_READONLY_SUPER_USERS:
          - readonly
    post:
    - ref: quay-gather-jaeger-traces
    - ref: quay-gather
    - ref: quay-deprovision
    - chain: ipi-aws-post
    test:
    - ref: quay-enable-catalogsource
    - ref: quay-provisioning-tls
    - ref: quay-provisioning-builder
    - ref: quay-deploy-mailpit
    - ref: quay-deploy-jaeger
    - ref: quay-deploy-aws-s3
    - ref: quay-deploy-custom-image
    - ref: quay-test-e2e
    workflow: ipi-aws
  timeout: 4h0m0s
