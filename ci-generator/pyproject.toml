[project]
name = "ci-generator"
version = "0.1.0"
description = "Generate ci-operator configs from a compact Quay CI matrix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
