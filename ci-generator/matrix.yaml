version: 2

global_defaults:
  image_source: build
  arch: amd64
  repo: quay/quay

quay:
  - branch: redhat-3.18
    jobs:
      - tier: daily
        clouds: [aws, azure]
        ocp: ["4.22"]
        test: e2e-install
      - tier: weekly
        clouds: [gcp]
        ocp: ["4.22"]
        test: e2e-install
  - branch: redhat-3.17
    env:
      PLAYWRIGHT_GREP_INVERT: "@auth:OIDC|@auth:LDAP"
      QUAY_EXTRA_CONFIG: |
        FEATURE_USER_METADATA: true
        FEATURE_EDIT_QUOTA: true
        FEATURE_IMMUTABLE_TAGS: true
        FEATURE_SPARSE_INDEX: true
        FEATURE_CHANGE_TAG_EXPIRATION: true
        FEATURE_IMAGE_PULL_STATS: false
        LOG_ARCHIVE_LOCATION: default
        ACTION_LOG_ARCHIVE_LOCATION: default
        SESSION_TIMEOUT: 2h
        FEATURE_MAILING: true
        MAIL_SERVER: mailpit.quay-enterprise.svc.cluster.local
        MAIL_PORT: 1025
        MAIL_USE_TLS: false
        MAIL_USE_AUTH: false
        MAIL_DEFAULT_SENDER: quay@quayqe.local
        DEFAULT_UI: react
        SUPER_USERS:
          - admin
        GLOBAL_READONLY_SUPER_USERS:
          - readonly
    jobs:
      - tier: daily
        clouds: [gcp, azure]
        ocp: ["4.22"]
        test: e2e-install
  - branch: redhat-3.16
    env:
      PLAYWRIGHT_GREP_INVERT: "@auth:OIDC|@auth:LDAP"
      QUAY_EXTRA_CONFIG: |
        FEATURE_USER_METADATA: true
        FEATURE_EDIT_QUOTA: true
        FEATURE_CHANGE_TAG_EXPIRATION: true
        FEATURE_IMAGE_PULL_STATS: false
        LOG_ARCHIVE_LOCATION: default
        ACTION_LOG_ARCHIVE_LOCATION: default
        SESSION_TIMEOUT: 2h
        FEATURE_MAILING: true
        MAIL_SERVER: mailpit.quay-enterprise.svc.cluster.local
        MAIL_PORT: 1025
        MAIL_USE_TLS: false
        MAIL_USE_AUTH: false
        MAIL_DEFAULT_SENDER: quay@quayqe.local
        DEFAULT_UI: react
        SUPER_USERS:
          - admin
        GLOBAL_READONLY_SUPER_USERS:
          - readonly
    jobs:
      - tier: daily
        clouds: [gcp, azure]
        ocp: ["4.22"]
        test: e2e-install
