version: 2

global_defaults:
  image_source: build
  arch: amd64
  repo: quay/quay

managed_files:
  active:
    - quay-quay-master.yaml
    - quay-quay-redhat-3.18__aws-ocp422-e2e-install.yaml
    - quay-quay-redhat-3.18__aws-ocp50-e2e-install.yaml
    - quay-quay-redhat-3.18__gcp-ocp422-e2e-install.yaml
  retired: []

quay:
  - branch: redhat-3.18
    jobs:
      - cron: daily
        source: nightly
        clouds: [aws,gcp]
        ocp: ["4.22"]
        test: e2e-install
      - cron: weekly
        source: nightly
        clouds: [aws]
        ocp: ["5.0"]
        test: e2e-install
  - branch: master
    layout: base
    env:
      QUAY_OPERATOR_CHANNEL: stable-3.18
      QUAY_OPERATOR_SOURCE: redhat-operators
    jobs:
      - kind: presubmit
        clouds: [aws, gcp]
        ocp: ["4.22"]
        test: e2e-install
        always_run: false
        optional: true
